[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypertagging-unified"
version = "0.0.0"
description = "Unified HyperTagging migration skeleton"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "awkward",
  "pyarrow",
  "torch",
  "uproot",
  "pdg",
  "onnx",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
notebook = [
  "ipykernel",
  "jupyterlab",
  "matplotlib",
  "nbclient",
  "nbformat",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
