model_preset: gpu_debug
scientific_mode: true
curriculum_mode: progressive
require_final_curriculum_phase: true
warmup_fraction: 0.05
max_warmup_steps: 10000
validation_events: 256
validation_views:
  - fsp_topology_anticollapse
  - truth_guided_distance_radius
  - multilevel_channel_memory
  - corrupted_composites_hard_negatives
channel_memory_size: 4096
channel_zero_positive_validation_window: 1
channel_zero_positive_action: warn
objective_gradient_diagnostics: true
objective_gradient_diagnostics_every: 1
pilot_objective_preflight: true
objective_dominance_ratio: 20.0
pilot_objective_violation_action: fail
best_metric: validation_full_training_objective
lca_relation_weight: 1.0
parent_ranking_weight: 1.0
exact_tree_distance_weight: 1.0
radius_depth_weight: 0.2
channel_weight: 0.2
variance_weight: 0.1
covariance_weight: 0.01
leaf_pid_weight: 1.0
corruption_class_weight: 0.1
candidate_correctness_weight: 0.1
hard_negative_weight: 0.1
truth_guided_structural_relation_inputs: false
