model_preset: production_baseline
d_model: 256
hyper_dim: 64
n_heads: 8
n_context_layers: 6
ffn_dim: 1024
dropout: 0.1
curvature: 1.0
tangent_variance_target: 0.05
hyper_projection_init_scale: 0.05
tangent_scale_mode: fixed
hyperbolic_scale_contract_version: dimension-aware-tangent-radius-v2
tree_geometry_contract_version: retained-tree-exact-edges-v2
tree_distance_contract_version: exact-edge-log-fixed-scale-v2
relation_feature_contract_version: physical-relations-overlap-aware-v2
n_queries: 32
n_queries_by_level:
  - [1, 32]
  - [2, 24]
  - [3, 16]
max_cardinality: 12
max_cardinality_by_level:
  - [1, 8]
  - [2, 10]
  - [3, 12]
