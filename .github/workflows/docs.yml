name: Documentation and Pages

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # Privacy validation deliberately scans every generated token and artifact.
    # Phase66 measured 58.53 minutes against this unchanged 60-minute bound.
    # Compatibility layouts have separate read-only runners; deployment needs all jobs.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install documentation tools only
        run: python -m pip install --disable-pip-version-check -r docs/requirements-test.txt
      - name: Use the source commit clock
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Documentation and workflow regression checks
        run: python -m pytest -q tests/test_docs_*_cpu.py
      - name: Validate coverage and independent regeneration
        run: python scripts/build_docs.py --output "$RUNNER_TEMP/hypertagging-docs" --check-generation --workflow
      - name: Upload validated Pages artifact from master only
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/hypertagging-docs/html
          retention-days: 1
          include-hidden-files: true

  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        layout: [text, basf2]
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install documentation tools only
        run: python -m pip install --disable-pip-version-check -r docs/requirements-test.txt
      - name: Use the source commit clock
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Validate every compatibility layout
        env:
          DOCS_LAYOUT: ${{ matrix.layout }}
        run: |
          case "$DOCS_LAYOUT" in
            text) python scripts/build_docs.py --builder text --output "$RUNNER_TEMP/hypertagging-docs-text" ;;
            basf2) python scripts/build_docs.py --layout basf2 --output "$RUNNER_TEMP/hypertagging-docs-basf2" ;;
            *) exit 1 ;;
          esac

  deploy:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master'
    needs: [build, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure the Pages deployment
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
