name: Full documentation validation

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * 1"

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    # Full archive builds run weekly or on demand; PRs run regression tests.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements*.txt
      - name: Install documentation tools only
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - name: Use the source commit clock
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Validate coverage and independent regeneration
        run: python scripts/build_docs.py --output "$RUNNER_TEMP/hypertagging-docs" --check-generation

  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        layout: [text, basf2]
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements*.txt
      - name: Install documentation tools only
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - name: Use the source commit clock
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Validate every compatibility layout
        env:
          DOCS_LAYOUT: ${{ matrix.layout }}
        run: |
          case "$DOCS_LAYOUT" in
            text) python scripts/build_docs.py --builder text --output "$RUNNER_TEMP/hypertagging-docs-text" ;;
            basf2) python scripts/build_docs.py --layout basf2 --output "$RUNNER_TEMP/hypertagging-docs-basf2" ;;
            *) exit 1 ;;
          esac
