name: Full notebook smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  all-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,notebook]"
      - name: Execute all 12 deterministic CPU notebook groups
        run: python scripts/execute_notebook_smoke_tests.py
