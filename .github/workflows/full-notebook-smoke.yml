name: Full notebook smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  all-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,notebook]"
      - name: Report runner-derived notebook count
        run: python scripts/execute_notebook_smoke_tests.py --list
      - name: Execute every deterministic CPU notebook group
        run: >-
          python scripts/execute_notebook_smoke_tests.py
          --keep-output /tmp/hypertagging-all-notebooks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-notebook-summary
          path: /tmp/hypertagging-all-notebooks/notebook_execution_summary.json
