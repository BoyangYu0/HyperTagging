name: CPU correctness

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Explicit source or audit commit to verify
        required: false
        type: string

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,notebook]"
      - name: Unit suite
        run: python -m pytest -q | tee pytest-summary.txt
      - name: Audit integrity
        run: python scripts/validate_audit_integrity.py
      - name: Generated notebook consistency
        run: python scripts/execute_notebook_smoke_tests.py --check-generated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-pytest-summary
          path: pytest-summary.txt

  notebook-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,notebook]"
      - name: Core push/PR notebooks selected from index
        run: >-
          python scripts/execute_notebook_smoke_tests.py
          --keep-output /tmp/hypertagging-notebook-smoke
          --ci-frequency push_and_weekly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-notebook-summary
          path: |
            /tmp/hypertagging-notebook-smoke/notebook_execution_summary.json
            /tmp/hypertagging-notebook-smoke/visual_review_index.html
            /tmp/hypertagging-notebook-smoke/visual_review_index.json
            /tmp/hypertagging-notebook-smoke/validation_overview.html
            /tmp/hypertagging-notebook-smoke/validation_overview.md
            /tmp/hypertagging-notebook-smoke/validation_overview.json
