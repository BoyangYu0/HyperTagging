name: CPU correctness

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,notebook]"
      - name: Unit suite
        run: python -m pytest -q | tee pytest-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-pytest-summary
          path: pytest-summary.txt

  notebook-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,notebook]"
      - name: Selected deterministic CPU notebooks
        run: >-
          python scripts/execute_notebook_smoke_tests.py
          --keep-output /tmp/hypertagging-notebook-smoke
          --only dataset
          --only leaf_pid
          --only leaf_composite
          --only streaming
          --only hyperbolic
          --only training
          --only reconstruction
          --only qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-notebook-summary
          path: /tmp/hypertagging-notebook-smoke/notebook_execution_summary.json
