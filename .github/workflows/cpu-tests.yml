name: CPU correctness

on:
  push:
    branches: [master, "codex/phase70-review-next-20261006", "codex/phase71-review-next-20261007", "codex/phase72-review-next-20261008", "codex/phase74-development-20261008", "codex/phase76-membership-20261009", "codex/phase77-proposal-20261009"]
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Explicit source or audit commit to verify
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

concurrency:
  group: cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CUDA_VISIBLE_DEVICES: ""
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docs/requirements*.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -e ".[dev,notebook]" -r docs/requirements-test.txt
      - name: Unit suite including documentation regressions
        run: python -m pytest -q | tee pytest-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-pytest-summary
          path: |
            pytest-summary.txt
